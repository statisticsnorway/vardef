micronaut:
  application:
    name: vardef
    version: {{APP_VERSION}}  # Placeholder filled by the setVersionProperty task during the Gradle build
  auth:
    issuers:
      labid:
        - https://labid.lab.dapla-external.ssb.no
      keycloak:
        - https://auth.ssb.no/realms/ssb
  security:
    jwks:
      # Token signature verification is performed by the gateway
      enabled: false
    token:
      jwt:
        claims-validators:
          audience:
            - vardef
        claims:
          keys:
            labid:
              dapla-groups: dapla.groups
              dapla-group: dapla.group
            keycloak:
              dapla: dapla
              dapla-groups: groups
              dapla-teams: teams
    intercept-url-map:
      - pattern: /health/**
        http-method: GET
        access: isAnonymous()
      - pattern: /metrics/**
        http-method: GET
        access: isAnonymous()
      - pattern: /prometheus/**
        http-method: GET
        access: isAnonymous()
      - pattern: /docs/**
        http-method: GET
        access: isAnonymous()
      - pattern: /**
        access: isAuthenticated()
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /docs/openapi/variable-definitions/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /docs/swagger/variable-definitions/**
  serde:
    deserialization:
      ignore-unknown: false
      strict-nullable: true
    serialization:
      inclusion: always
  logger:
    config: logback.xml
  server:
    netty:
      access-logger:
        enabled: true
        exclusions:
          - /health/.+
          - /metrics
          - /prometheus
          - /docs/.+
          - /favicon.ico
        log-format: '{
          "requestMethod":"%m",
          "requestUrl":"%x",
          "status":%s,
          "responseSize":"%B",
          "userAgent":"%{User-Agent}i",
          "remoteIp":"%a",
          "serverIp":"%A",
          "referer":"%i",
          "latency":"%Dms",
          "protocol":"%H"}'
  caches:
    classifications:
      maximumSize: 3600
      expire-after-write: 24h
    codes:
      maximumSize: 3600
      expire-after-write: 24h
    klass-not-found:
      maximumSize: 3600
      expire-after-write: 5m
  http:
    request-headers:
      user-agent: ${micronaut.application.name}/${micronaut.application.version} (metadata@ssb.no)
    services:
      klass:
        url: https://data.ssb.no/api/klass/v1/
        health-check: false
      vardok:
        url: https://www.ssb.no/a/xml/metadata/conceptvariable/vardok/
      dapla-api:
        url: https://dapla-api.ssb.no
        read-timeout: 30s
        health-check: false

  metrics:
    sensitive: false
    enabled: true
    custom:
      # Used for exporting custom business metrics
      update-frequency: 1h
      initial-delay: 30s
    tags:
      application: ${micronaut.application.name}
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

klass:
  url:
    web: "https://dataportal.ssb.no/classifications"
  classifications:
    subject-fields:
      id: 618
      date: today
      levels: null
    unit-types:
      id: 702
      date: today
      levels: null
    measurement-type:
      id: 303
      date: today
      levels:
        - 1

endpoints:
  all:
    port: 8090
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
    service-http-client:
      enabled: true
    monitor:
      enabled: true

jackson:
  xml:
    enabled: true
