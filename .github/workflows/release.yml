name: Create GitHub Release

on:
  push:
    branches:
      - main

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    outputs:
      image-tag: ${{steps.check-version.outputs.tag}}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Fetch last 2 commits to compare

      - name: Check Version Change
        id: check-version
        run: |
          CURRENT_VERSION=$(grep 'version =' build.gradle.kts | cut -d'"' -f2)
          PREVIOUS_VERSION=$(git show HEAD~1:build.gradle.kts | grep 'version =' | cut -d'"' -f2)
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "tag=v$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.check-version.outputs.tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ steps.check-version.outputs.tag }}
          git push origin tag ${{ steps.check-version.outputs.tag }}

      - name: Publish release notes
        if: steps.check-version.outputs.tag
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: true
          tag: ${{ steps.check-version.outputs.tag }}

  deploy-prod:
    name: Deploy to prod
    needs: create-release
    if: needs.create-release.outputs.image-tag != ''
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      cluster: prod
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    secrets: inherit
