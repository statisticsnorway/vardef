
name: Deploy alerts
run-name: Deploy alerts for vardef to test and prod

on:
  push:
    branches:
      - main
    paths:
      - '.nais/prod/alerts.yaml'
      - '.nais/test/alerts.yaml'
      - '.github/workflows/alert-deploy.yml'
permissions:
  id-token: write

jobs:
  test-deploy:
    name: Deploy alerts to test
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to test
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: test
          RESOURCE: .nais/test/alerts.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443

  prod-deploy:
    name: Deploy alerts to prod
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: prod
          RESOURCE: .nais/prod/alerts.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443